<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="gisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="tealLayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Base Background Hex/Shield or Rounded Square -->
  <rect x="8" y="8" width="144" height="144" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- 2D Ground Cadastral Grid Layer -->
  <polygon points="80,126 32,98 80,72 128,98" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="56" y1="85" x2="104" y2="112" stroke="#CBD5E1" stroke-width="1.2"/>
  <line x1="104" y1="85" x2="56" y2="112" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- Intermediate 3D Vertical Extrusion Layer -->
  <polygon points="80,102 38,78 80,56 122,78" fill="#CCFBF1" stroke="#0F766E" stroke-width="2" opacity="0.85"/>
  <polygon points="38,78 38,88 80,112 80,102" fill="#0F766E" opacity="0.6"/>
  <polygon points="122,78 122,88 80,112 80,102" fill="#0D9488" opacity="0.8"/>

  <!-- Top Vertical Property Unit / Penthouse Level -->
  <polygon points="80,76 44,56 80,36 116,56" fill="url(#tealLayer)" filter="url(#subtleShadow)"/>
  <polygon points="44,56 44,66 80,86 80,76" fill="#0F766E"/>
  <polygon points="116,56 116,66 80,86 80,76" fill="#115E59"/>

  <!-- Spatial Pin & Verification Pulse at Pinnacle -->
  <circle cx="80" cy="46" r="4" fill="#FFFFFF"/>
  <circle cx="80" cy="46" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <polygon points="80,24 84,32 76,32" fill="#0F766E"/>
</svg>